spring:
  application:
    name: users
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app_users}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    # Tells Hibernate which DB we are using to generate correct syntax , Often detected automatically
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update  # Options : none, validate, update, create, create-drop
    show-sql: true
    # Default is false , when false data.sql/schema.sql runs before hibernate initializes
    defer-datasource-initialization: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

